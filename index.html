<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Lobby</title>
<style>
  :root { --bg: #0a0a0b; --hint-bg: rgba(20,22,26,.85); --hint-fg: #d6dbe1; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); }
  canvas { display: block; touch-action: none; cursor: grab; }
  canvas:active { cursor: grabbing; }
  #loading {
    position: fixed; inset: 0; z-index: 60; background: #060608;
    display: flex; align-items: center; justify-content: center;
    transition: opacity .6s ease;
  }
  #loading span {
    color: #9a93ad; font: 12px/1 system-ui, -apple-system, "Segoe UI", sans-serif;
    letter-spacing: .28em; text-transform: uppercase;
  }
  #loading.off { opacity: 0; pointer-events: none; }
  #stats {
    position: fixed; left: 12px; top: 12px; z-index: 45; pointer-events: none;
    background: rgba(10,10,14,.8); color: #cfe3ff; border: 1px solid #23232b; border-radius: 8px;
    padding: 6px 9px; font: 12px/1.5 ui-monospace, Menlo, Consolas, monospace; white-space: pre;
  }
  #stats[hidden] { display: none; }
  #fade {
    position: fixed; inset: 0; background: #000; opacity: 0; pointer-events: none;
    transition: opacity .5s ease; z-index: 50;
  }
  #fade.on { opacity: 1; }
  #door {
    position: fixed; inset: 0; z-index: 42; display: flex; align-items: center; justify-content: center;
    background: rgba(4,4,7,.55);
  }
  #door[hidden] { display: none; }
  #door-card {
    background: rgba(12,12,16,.96); border: 1px solid #2a2a33; border-radius: 12px;
    padding: 22px 24px; text-align: center; min-width: 260px;
    box-shadow: 0 18px 50px rgba(0,0,0,.6);
    font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; color: #e6e8ec;
  }
  #door-title { margin: 0 0 16px; letter-spacing: .16em; text-transform: uppercase; font-size: 13px; color: #cdbdf5; }
  #door-actions { display: flex; gap: 10px; justify-content: center; }
  #door-actions button {
    border: 1px solid #2f2f3a; background: #16161d; color: #d8dbe2;
    padding: 9px 18px; border-radius: 8px; font: inherit; cursor: pointer;
  }
  #door-exit { background: #4a3d6b; border-color: #5a4b80; color: #fff; }
  #chat {
    position: fixed; right: 16px; bottom: 16px; width: min(380px, calc(100% - 32px));
    max-height: min(60vh, 520px); display: flex; flex-direction: column; z-index: 40;
    background: rgba(12,12,16,.92); border: 1px solid #2a2a33; border-radius: 12px;
    font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; color: #e6e8ec;
    box-shadow: 0 18px 50px rgba(0,0,0,.6);
  }
  #chat[hidden] { display: none; }
  @media (max-width: 680px) {
    #chat {
      top: calc(8px + env(safe-area-inset-top, 0px)); bottom: auto;
      left: 8px; right: 8px; width: auto; max-height: 42vh;
    }
  }
  #chat-bar { display: flex; align-items: center; justify-content: space-between;
    padding: 10px 12px; border-bottom: 1px solid #23232b; }
  #chat-name { letter-spacing: .14em; font-size: 12px; color: #b79cf2; text-transform: uppercase; }
  #chat-close { background: none; border: 0; color: #8b8f99; font-size: 20px; cursor: pointer; line-height: 1; }
  #chat-log { overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
  #chat-log .msg { max-width: 85%; padding: 8px 11px; border-radius: 10px; white-space: pre-wrap; }
  #chat-log .them { background: #1b1b23; align-self: flex-start; }
  #chat-log .me { background: #3b3050; align-self: flex-end; }
  #chat-log .sys { color: #8b8f99; font-size: 12px; align-self: center; }
  #chat-form { display: flex; gap: 8px; padding: 10px; border-top: 1px solid #23232b; }
  #chat-input { flex: 1; background: #16161d; border: 1px solid #2a2a33; border-radius: 8px;
    padding: 8px 10px; color: inherit; font: inherit; }
  #chat-send { background: #4a3d6b; border: 0; border-radius: 8px; color: #fff;
    padding: 8px 14px; font: inherit; cursor: pointer; }
  #chat-send[disabled] { opacity: .5; cursor: default; }
  #hint {
    position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%);
    background: var(--hint-bg); color: var(--hint-fg);
    font: 13px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
    padding: 8px 14px; border-radius: 8px; pointer-events: none;
    max-width: calc(100% - 32px); text-align: center; transition: opacity .6s;
  }
</style>
</head>
<body>
<div id="loading"><span>Entering the lobby…</span></div>
<div id="hint"></div>
<div id="fade"></div>
<div id="stats" hidden></div>
<div id="door" hidden>
  <div id="door-card">
    <p id="door-title">Explore the District</p>
    <div id="door-actions">
      <button id="door-stay" type="button">Stay</button>
      <button id="door-exit" type="button">Exit</button>
    </div>
  </div>
</div>
<div id="chat" hidden>
  <div id="chat-bar"><span id="chat-name">Nexie</span><button id="chat-close" aria-label="Close">×</button></div>
  <div id="chat-log"></div>
  <form id="chat-form" autocomplete="off">
    <input id="chat-input" type="text" placeholder="Say something…" maxlength="600">
    <button id="chat-send" type="submit">Send</button>
  </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/loaders/FontLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/geometries/TextGeometry.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/utils/BufferGeometryUtils.js"></script>
<script>
// ================= SETTINGS =================
const LOOK_SPEED = 0.0035;
const DESKTOP_LOOK_X = 1;    // 1: drag right turns left (grab). Set to -1 to flip.
const DESKTOP_LOOK_Y = 1;
const TOUCH_LOOK_X = 1;
const TOUCH_LOOK_Y = 1;
const EYE_HEIGHT = 1.7;
const PLAYER_RADIUS = 0.4;
const WALL_SHEEN = 0.45;     // gloss layer on the walls: 0 = matte, 1 = mirror-bright highlights
const ARTWORK_URL = '';      // put a jpg/png path here, or just drag an image onto the page

const isTouch = matchMedia('(pointer: coarse)').matches;
const hint = document.getElementById('hint');
hint.textContent = isTouch
  ? 'One finger to look, two fingers to walk, tap Nexie or the doors'
  : 'Drag to look, scroll or WASD to walk, click Nexie or the doors';
setTimeout(() => hint.style.opacity = 0, 6000);

// ================= RENDERER / SCENE =================
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, isTouch ? 1.75 : 1.5));
renderer.setSize(innerWidth, innerHeight);
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.localClippingEnabled = true;   // lets the falling glyphs be cut off by the lips
document.body.appendChild(renderer.domElement);

const SKY = 0x6a5c86;        // purple haze at the horizon
const SKY_TOP = 0x1d1830;    // deep violet overhead
const scene = new THREE.Scene();
scene.fog = new THREE.Fog(SKY, 200, 2700);

// vertical gradient sky
{
  const c = document.createElement('canvas');
  c.width = 4; c.height = 256;
  const g = c.getContext('2d');
  const grad = g.createLinearGradient(0, 0, 0, 256);
  grad.addColorStop(0, '#1b162c');
  grad.addColorStop(0.42, '#2f2745');
  grad.addColorStop(0.60, '#544a72');
  grad.addColorStop(0.76, '#8a76a6');
  grad.addColorStop(1, '#3b3352');
  g.fillStyle = grad;
  g.fillRect(0, 0, 4, 256);
  const t = new THREE.CanvasTexture(c);
  t.mapping = THREE.EquirectangularReflectionMapping;
  t.encoding = THREE.sRGBEncoding;
  scene.background = t;
}

const camera = new THREE.PerspectiveCamera(65, innerWidth / innerHeight, 0.25, 4000);
camera.rotation.order = 'YXZ';

// ================= ROOM DIMENSIONS =================
const W = 20, D = 20, H = 10;
const hw = W / 2, hd = D / 2;
const T = 0.3; // wall thickness
const WIN = { x0: -8, x1: 8, y0: 0.4, y1: H - 0.8 };

const FLOOR = 9;             // height of the lobby floor above the ground outside

let PARENT = scene;          // helpers add here (scene for the lobby, OUT for the world outside)
const obstacles = [];
function solid(obj) { obstacles.push(new THREE.Box3().setFromObject(obj)); return obj; }

// ================= REFLECTION ENVIRONMENT =================
// Small stand-in room with bright strips so glossy surfaces have something to reflect
{
  const env = new THREE.Scene();
  const shell = new THREE.Mesh(new THREE.BoxGeometry(W, H, D),
    new THREE.MeshBasicMaterial({ color: 0x0c0c0e, side: THREE.BackSide }));
  shell.position.y = H / 2;
  env.add(shell);
  const white = new THREE.MeshBasicMaterial({ color: 0x6e6e6e });
  for (let x = -6; x <= 6; x += 4) {
    const s = new THREE.Mesh(new THREE.PlaneGeometry(0.35, 11), white);
    s.rotation.x = Math.PI / 2; s.position.set(x, H - 0.05, 0);
    env.add(s);
  }
  const win = new THREE.Mesh(new THREE.PlaneGeometry(WIN.x1 - WIN.x0, WIN.y1 - WIN.y0),
    new THREE.MeshBasicMaterial({ color: 0x7b6b96 }));
  win.position.set(0, (WIN.y0 + WIN.y1) / 2, -hd + 0.05);
  env.add(win);
  const pmrem = new THREE.PMREMGenerator(renderer);
  scene.environment = pmrem.fromScene(env, 0.02, 0.1, 100).texture;
  pmrem.dispose();
}

// ================= MATERIALS =================
function tileTexture() {
  const c = document.createElement('canvas');
  c.width = c.height = 512;
  const g = c.getContext('2d');
  g.fillStyle = '#ffffff';
  g.fillRect(0, 0, 512, 512);
  g.strokeStyle = '#8a8a8a';
  g.lineWidth = 2;
  for (let k = 0; k <= 512; k += 256) {
    g.beginPath(); g.moveTo(k, 0); g.lineTo(k, 512); g.stroke();
    g.beginPath(); g.moveTo(0, k); g.lineTo(512, k); g.stroke();
  }
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(W / 4, D / 4);
  t.encoding = THREE.sRGBEncoding;
  t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return t;
}

// phones skip the clearcoat layer: same look, far cheaper shader
const gloss = (color, extra = {}) => {
  const o = { color, roughness: 0.18, metalness: 0.1, clearcoat: 1, clearcoatRoughness: 0.04,
              envMapIntensity: 1.4, ...extra };
  if (isTouch) {
    const { clearcoat, clearcoatRoughness, ...rest } = o;
    return new THREE.MeshStandardMaterial({ ...rest, roughness: Math.max(0.2, o.roughness) });
  }
  return new THREE.MeshPhysicalMaterial(o);
};

const M = {
  floor:     gloss(0x0a0a0b, { map: tileTexture(), roughness: 0.34, clearcoatRoughness: 0.16, envMapIntensity: 0.55 }),
  wall:      isTouch
               ? new THREE.MeshStandardMaterial({ color: 0x0c0c0d, roughness: 0.6, metalness: 0, envMapIntensity: 0 })
               : new THREE.MeshPhysicalMaterial({ color: 0x0c0c0d, roughness: 0.7, metalness: 0,
                   clearcoat: WALL_SHEEN, clearcoatRoughness: 0.38, envMapIntensity: 0 }),
  ceiling:   new THREE.MeshStandardMaterial({ color: 0x0a0a0c, roughness: 0.9, metalness: 0, envMapIntensity: 0 }),
  black:     gloss(0x111113),
  charcoal:  new THREE.MeshStandardMaterial({ color: 0x2a2b2e, roughness: 0.5 }),
  grey:      new THREE.MeshStandardMaterial({ color: 0x6a6d72, roughness: 0.9 }),
  lightGrey: new THREE.MeshStandardMaterial({ color: 0x9a9da2, roughness: 0.35 }),
  frame:     new THREE.MeshStandardMaterial({ color: 0x151518, roughness: 0.3, metalness: 0.7 }),
  steel:     new THREE.MeshStandardMaterial({ color: 0x9da1a8, roughness: 0.2, metalness: 1 }),
  rug:       new THREE.MeshStandardMaterial({ color: 0x2e3034, roughness: 1 }),
  glassTop:  gloss(0x050506, { roughness: 0.05 }),
  glass:     new THREE.MeshPhysicalMaterial({ color: 0xdfeef7, roughness: 0.45, metalness: 0,
               transparent: true, opacity: 0.05, depthWrite: false, envMapIntensity: 0 }),
  led:       new THREE.MeshBasicMaterial({ color: 0xffffff, toneMapped: false }),
  curtain:   new THREE.MeshPhysicalMaterial({ color: 0xaecad8, roughness: 0.35, metalness: 0,
               transparent: true, opacity: 0.09, depthWrite: false, envMapIntensity: 0 }),
  leaf:      new THREE.MeshPhysicalMaterial({ color: 0x9fbccb, roughness: 0.25, metalness: 0,
               transparent: true, opacity: 0.16, depthWrite: false, envMapIntensity: 0 }),
};

// while BATCH is on, shapes are collected per material and merged into single meshes
let BATCH = false;
const batch = new Map();
function collect(geo, mat, x, y, z) {
  geo.translate(x, y, z);
  if (!batch.has(mat)) batch.set(mat, []);
  batch.get(mat).push(geo);
}
function flushBatch(parent) {
  const U = THREE.BufferGeometryUtils;
  for (const [mat, list] of batch) {
    if (U && list.length > 1) {
      const merged = U.mergeBufferGeometries(list, false);
      list.forEach(g => g.dispose());
      parent.add(new THREE.Mesh(merged, mat));
    } else {
      list.forEach(g => parent.add(new THREE.Mesh(g, mat)));
    }
  }
  batch.clear();
}
function box(w, h, d, mat, x, y, z, parent = PARENT) {
  const geo = new THREE.BoxGeometry(w, h, d);
  if (BATCH) { collect(geo, mat, x, y, z); return null; }
  const m = new THREE.Mesh(geo, mat);
  m.position.set(x, y, z);
  parent.add(m);
  return m;
}
function cyl(rt, rb, h, mat, x, y, z, parent = PARENT, seg = 32) {
  const geo = new THREE.CylinderGeometry(rt, rb, h, seg);
  if (BATCH) { collect(geo, mat, x, y, z); return null; }
  const m = new THREE.Mesh(geo, mat);
  m.position.set(x, y, z);
  parent.add(m);
  return m;
}

// ================= SHELL =================
const floor = new THREE.Mesh(new THREE.PlaneGeometry(W, D), M.floor);
floor.rotation.x = -Math.PI / 2;
scene.add(floor);

BATCH = true;    // static shell, glazing and strips merge into a few meshes
box(W + 2 * T, T, D + 2 * T, M.ceiling, 0, H + T / 2, 0);            // ceiling
box(T, H, D + 2 * T, M.wall, -hw - T / 2, H / 2, 0);                  // left wall
box(T, H, D + 2 * T, M.wall,  hw + T / 2, H / 2, 0);                  // right wall
// front wall: glazed curtain wall, two door bays in the middle
{
  const fz = hd + 0.1, BAYS = 4, bw = W / BAYS, DOOR_H = 3.2, TRANSOM = 6.6;
  const pane = new THREE.Mesh(new THREE.PlaneGeometry(W, H), M.curtain);
  pane.position.set(0, H / 2, fz + 0.02);
  scene.add(pane);
  for (let i = 0; i <= BAYS; i++) box(0.12, H, 0.32, M.frame, -hw + i * bw, H / 2, fz);   // mullions
  box(W, 0.12, 0.32, M.frame, 0, DOOR_H, fz);                                            // door head
  box(W, 0.12, 0.32, M.frame, 0, TRANSOM, fz);                                           // transom
  box(W, 0.4, 0.34, M.black, 0, 0.2, fz);                                                // spandrel at the floor

  // four door bays, a pair of swinging leaves in each
  const DB = 2.5, lw = DB / 2 - 0.13;
  for (const x of [-2 * DB, -DB, 0, DB, 2 * DB]) box(0.1, DOOR_H, 0.26, M.frame, x, DOOR_H / 2, fz - 0.02);  // jambs
  for (const bay of [-3, -1, 1, 3]) {
    const cx = bay * DB / 2;
    for (const side of [-1, 1]) {
      const lx = cx + side * (DB / 4 + 0.015);
      box(lw, DOOR_H - 0.2, 0.05, M.leaf, lx, (DOOR_H - 0.2) / 2 + 0.06, fz - 0.06);      // glass leaf
      box(lw, 0.07, 0.09, M.frame, lx, 0.09, fz - 0.06);                                  // bottom rail
      box(lw, 0.07, 0.09, M.frame, lx, DOOR_H - 0.09, fz - 0.06);                         // top rail
      box(0.05, DOOR_H - 0.6, 0.05, M.frame, lx + side * (lw / 2 - 0.02), DOOR_H / 2, fz - 0.06); // outer stile
      box(0.045, 1.15, 0.045, M.steel, cx + side * 0.17, 1.05, fz - 0.17);                // pull, on the swinging edge
      box(0.045, 0.045, 0.1, M.steel, cx + side * 0.17, 1.6, fz - 0.12);                  // handle standoffs
      box(0.045, 0.045, 0.1, M.steel, cx + side * 0.17, 0.5, fz - 0.12);
    }
  }
}

// Window wall (back, behind the desk)
const wz = -hd - T / 2;
box(W + 2 * T, WIN.y0, T, M.wall, 0, WIN.y0 / 2, wz);
box(W + 2 * T, H - WIN.y1, T, M.wall, 0, (WIN.y1 + H) / 2, wz);
const sideW = hw + T + WIN.x0;
box(sideW, WIN.y1 - WIN.y0, T, M.wall, -hw - T + sideW / 2, (WIN.y0 + WIN.y1) / 2, wz);
box(sideW, WIN.y1 - WIN.y0, T, M.wall,  hw + T - sideW / 2, (WIN.y0 + WIN.y1) / 2, wz);

// Window frame, mullions, glass
const winH = WIN.y1 - WIN.y0, winW = WIN.x1 - WIN.x0, winY = (WIN.y0 + WIN.y1) / 2;
const PANES = 4;
box(winW + 0.2, 0.1, 0.4, M.frame, 0, WIN.y0, wz);
box(winW + 0.2, 0.1, 0.4, M.frame, 0, WIN.y1, wz);
for (let i = 0; i <= PANES; i++) box(0.08, winH, 0.4, M.frame, WIN.x0 + i * (winW / PANES), winY, wz);
const glass = new THREE.Mesh(new THREE.PlaneGeometry(winW, winH), M.glass);
glass.position.set(0, winY, wz);
scene.add(glass);

// ================= ENTRANCE STAIR (down to the plaza) =================
{
  const STEPS = Math.round(FLOOR / 0.18), RISE = FLOOR / STEPS, TREAD = 0.34, SW = 14;
  BATCH = true;
  box(SW, 0.3, 2.6, M.black, 0, -0.15, hd + 1.6);                       // landing outside the doors
  box(SW, 0.03, 0.03, M.led, 0, 0.02, hd + 2.85);
  for (let i = 1; i <= STEPS; i++) {
    box(SW, RISE, TREAD, M.black, 0, -RISE * (i - 0.5), hd + 2.9 + TREAD * (i - 0.5));
    if (i % 6 === 0) box(SW, 0.015, 0.015, M.led, 0, -RISE * (i - 1) - 0.01, hd + 2.9 + TREAD * (i - 1) + 0.01);
  }
  BATCH = false;
  flushBatch(scene);

  // sloped glass balustrades either side
  const run = STEPS * TREAD, ang = Math.atan2(FLOOR, run), len = Math.hypot(run, FLOOR);
  for (const side of [-1, 1]) {
    for (const [off, mat, h, d] of [[0.5, M.glass, 1.0, 0.06], [1.02, M.black, 0.07, 0.07], [0.97, M.led, 0.015, 0.015]]) {
      const m = box(d === 0.06 ? 0.06 : d, h, len, mat, side * (SW / 2 - 0.1), -FLOOR / 2 + off, hd + 2.9 + run / 2);
      m.rotation.x = ang;
    }
  }
  // facade below the doors
  BATCH = true;
  box(W + 2 * T, FLOOR, 0.4, M.black, 0, -FLOOR / 2, hd + 0.5);
}

// ================= LED LINES =================
// ceiling strips
for (let x = -6; x <= 6; x += 4) box(0.08, 0.02, 11, M.led, x, H - 0.01, 0);

// real lights along them: 8 on desktop, 2 on phones
const lampSpots = isTouch
  ? [[-3, 0], [3, 0]]
  : [[-6, -3], [-6, 3], [-2, -3], [-2, 3], [2, -3], [2, 3], [6, -3], [6, 3]];
for (const [lx, lz] of lampSpots) {
  const p = new THREE.PointLight(0xeef2ff, isTouch ? 0.75 : 0.34, isTouch ? 26 : 17, 2);
  p.position.set(lx, H - 0.15, lz);
  scene.add(p);
}
// ceiling perimeter
box(0.03, 0.03, D - 0.2, M.led, -hw + 0.05, H - 0.25, 0);
box(0.03, 0.03, D - 0.2, M.led,  hw - 0.05, H - 0.25, 0);
// floor perimeter
box(0.02, 0.02, D - 0.2, M.led, -hw + 0.03, 0.04, 0);
box(0.02, 0.02, D - 0.2, M.led,  hw - 0.03, 0.04, 0);

BATCH = false;
flushBatch(scene);

// Columns (kept separate: they act as obstacles)
[[-7.6, -8.2], [7.6, -8.2], [-7.6, 7.6], [7.6, 7.6]].forEach(([x, z]) => {
  solid(cyl(0.4, 0.4, H, M.black, x, H / 2, z));
  cyl(0.405, 0.405, 0.03, M.led, x, 0.3, z);
  cyl(0.405, 0.405, 0.03, M.led, x, H - 0.3, z);
});

// ================= FURNITURE =================
function sofa(x, z, rotY, len = 2.6) {
  const g = new THREE.Group();
  box(len, 0.42, 0.9, M.charcoal, 0, 0.21, 0, g);
  box(len, 0.5, 0.2, M.charcoal, 0, 0.65, -0.35, g);
  box(0.18, 0.62, 0.9, M.charcoal, -len / 2 + 0.09, 0.31, 0, g);
  box(0.18, 0.62, 0.9, M.charcoal,  len / 2 - 0.09, 0.31, 0, g);
  g.position.set(x, 0, z); g.rotation.y = rotY;
  scene.add(g); solid(g);
}
function armchair(x, z, rotY) {
  const g = new THREE.Group();
  box(0.85, 0.42, 0.8, M.grey, 0, 0.21, 0, g);
  box(0.85, 0.5, 0.16, M.grey, 0, 0.65, -0.32, g);
  box(0.12, 0.6, 0.8, M.grey, -0.36, 0.3, 0, g);
  box(0.12, 0.6, 0.8, M.grey,  0.36, 0.3, 0, g);
  g.position.set(x, 0, z); g.rotation.y = rotY;
  scene.add(g); solid(g);
}
function coffeeTable(x, z) {
  const g = new THREE.Group();
  box(1.4, 0.04, 0.8, M.glassTop, 0, 0.42, 0, g);

const rain = (() => {
  const c = document.createElement('canvas');
  c.width = 1024; c.height = 631;
  const g = c.getContext('2d');
  const FS = 17;
  const cols = Math.floor(c.width / FS);
  const drops = Array.from({ length: cols }, () => Math.random() * -50);
  const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%^&*+-=[]{}|;:<>?/!～！￥（）【】';
  const ch = () => chars.charAt(Math.floor(Math.random() * chars.length));
  g.fillStyle = '#000'; g.fillRect(0, 0, c.width, c.height);
  const tex = new THREE.CanvasTexture(c);
  tex.encoding = THREE.sRGBEncoding;
  function step() {
    g.fillStyle = 'rgba(0,0,0,0.2)';             // heavier fade = shorter, thinner trails
    g.fillRect(0, 0, c.width, c.height);
    g.font = FS + 'px monospace';
    for (let i = 0; i < cols; i++) {
      const x = i * FS, y = drops[i] * FS;
      g.fillStyle = 'rgba(232,238,246,0.95)';    // silver head
      g.fillText(ch(), x, y);
      g.fillStyle = 'rgba(176,138,240,0.55)';    // purple behind it
      g.fillText(ch(), x, y - FS);
      g.fillStyle = 'rgba(124,90,188,0.22)';
      g.fillText(ch(), x, y - FS * 2);
      if (y > c.height && Math.random() > 0.975) drops[i] = 0;
      drops[i] += 1;                             // exactly one row per step, so glyphs stay crisp
    }
  }
  for (let i = 0; i < 260; i++) step();          // drawn once, then held frozen
  tex.needsUpdate = true;
  let last = 0;
  function update(t) {
    if (t - last < 150) return;                  // a row every 150 ms
    last = t;
    step();
    tex.needsUpdate = true;
  }
  return { tex, update };
})();

// 3D glyphs falling in front of the panel, lip to lip
const glyphRain = (() => {
  const CHARS = 'ABCDEFGHJKLMNPQRSTUVWXYZ0123456789@#$%&*+=<>?!'.split('');
  const maps = CHARS.map(ch => {
    const c = document.createElement('canvas');
    c.width = c.height = 64;
    const g = c.getContext('2d');
    g.font = 'bold 52px monospace';
    g.textAlign = 'center';
    g.textBaseline = 'middle';
    g.fillStyle = '#ffffff';
    g.fillText(ch, 32, 34);
    const t = new THREE.CanvasTexture(c);
    t.encoding = THREE.sRGBEncoding;
    return t;
  });
  const pick = () => maps[Math.floor(Math.random() * maps.length)];

  const TOP = ART.y + ART.h / 2;          // underside of the spill lip
  const BOT = ART.y - ART.h / 2;          // top of the catch basin
  const clips = [                          // glyphs are sliced off outside the two lips
    new THREE.Plane(new THREE.Vector3(0, -1, 0), TOP),
    new THREE.Plane(new THREE.Vector3(0, 1, 0), -BOT)
  ];
  const COLS = isTouch ? 13 : 24, TRAIL = isTouch ? 6 : 8, DY = 0.25;
  const streams = [];
  for (let i = 0; i < COLS; i++) {
    const z = ART.z - ART.w / 2 + 0.25 + i * ((ART.w - 0.5) / (COLS - 1));
    const x = hw - 0.3 - (i % 4) * 0.055;               // stands well off the panel
    const glyphs = [];
    for (let k = 0; k < TRAIL; k++) {
      const head = k === 0;
      const mat = new THREE.MeshBasicMaterial({
        map: pick(), transparent: true, depthWrite: false, toneMapped: false, clippingPlanes: clips,
        color: head ? 0xe8eef6 : 0xa77ce8,               // silver head, purple tail
        opacity: 0
      });
      const m = new THREE.Mesh(new THREE.PlaneGeometry(0.26, 0.3), mat);
      m.userData.base = head ? 1 : 0.74 - k * 0.085;
      m.rotation.y = -Math.PI / 2;
      m.position.set(x, TOP + k * DY, z);
      scene.add(m);
      glyphs.push(m);
    }
    const span = (TOP - BOT) + TRAIL * DY + 2.5;
    streams.push({ glyphs, y: BOT - TRAIL * DY + Math.random() * span, speed: 0.85 + Math.random() * 0.8, t: 0 });
  }

  function update(dt) {
    for (const st of streams) {
      st.y -= st.speed * dt;
      st.t += dt;
      if (st.t > 0.14) {                                  // flicker the characters
        st.t = 0;
        st.glyphs[Math.floor(Math.random() * TRAIL)].material.map = pick();
      }
      if (st.y + (TRAIL - 1) * DY < BOT) {          // whole column has sunk into the basin
        st.y = TOP + 0.1 + Math.random() * 2.2;         // head restarts hidden above the lip
        st.speed = 0.85 + Math.random() * 0.8;
      }
      st.glyphs.forEach((m, k) => {
        const y = st.y + k * DY;                             // k 0 is the leading silver glyph
        m.position.y = y;                                    // clipped at both lips
        const outOfLip = Math.min(Math.max((TOP - y) / 0.5, 0), 1);   // bleeds out of the top lip
        const intoBasin = Math.min(Math.max((y - BOT) / 0.45, 0), 1); // soaks into the basin
        m.material.opacity = m.userData.base * outOfLip * intoBasin;
      });
    }
  }
  return { update };
})();

  cyl(4, 6.5, 64, m2, TX, 272, TZ, OUT, 16);      // skinny neck
  cyl(20, 26, 4, m, TX, 302, TZ, OUT, 28);        // saucer underside
  cyl(25, 20, 5.5, m, TX, 306.5, TZ, OUT, 28);    // saucer body
  cyl(11, 18, 5, m2, TX, 311.5, TZ, OUT, 24);     // saucer crown
  cyl(0.8, 2.8, 48, m2, TX, 338, TZ, OUT, 10);    // spire
  const ring = new THREE.Mesh(new THREE.CylinderGeometry(26.5, 26.5, 0.6, 30),
    new THREE.MeshBasicMaterial({ color: 0xb79cf2, toneMapped: false }));
  ring.position.set(TX, 304.3, TZ);
  OUT.add(ring);
}



BATCH = false;
flushBatch(OUT);         // city collapses into a few draw calls
PARENT = scene;

// ================= LIGHTS (no shadows) =================
scene.add(new THREE.HemisphereLight(0xa192bd, 0x2a2436, 0.45));
scene.add(new THREE.AmbientLight(0xffffff, 0.12));

const sun = new THREE.DirectionalLight(0xd8cdf0, 0.6);
sun.position.set(-10, 20, -30);
scene.add(sun);



// ================= NEXIE + CLICKABLE DOORS =================
const CFG = {
  name: 'Nexie',
  image: 'nexie.png',
  image2: 'nexie2.png',           // shown when you walk round to her right (your left)
  position: [1.2, 0, -7.12],      // right up against the desk
  height: 1.88,
  greeting: "Welcome to the Nexus District. First time here?",
  endpoint: '',                    // your Cloudflare Worker URL
  doorUrl: 'https://shaden.technology/nexus/'
};
let modalOpen = false;     // the door card blocks input; the chat does not
const typing = () => document.activeElement === document.getElementById('chat-input');

// placeholder silhouettes until nexie.png / nexie2.png are in place
function placeholderTexture(label = 'NEXIE', top = '#b79cf2', bottom = '#4a3d6b') {
  const c = document.createElement('canvas');
  c.width = 512; c.height = 1024;
  const g = c.getContext('2d');
  const grd = g.createLinearGradient(0, 0, 0, 1024);
  grd.addColorStop(0, top); grd.addColorStop(1, bottom);
  g.fillStyle = grd;
  g.beginPath(); g.arc(256, 190, 92, 0, Math.PI * 2); g.fill();          // head
  g.beginPath();
  g.moveTo(256, 290); g.bezierCurveTo(150, 330, 120, 560, 132, 1010);
  g.lineTo(380, 1010); g.bezierCurveTo(392, 560, 362, 330, 256, 290);
  g.fill();
  g.font = '600 46px system-ui, sans-serif'; g.textAlign = 'center';
  g.fillStyle = 'rgba(12,12,16,.85)'; g.fillText(label, 256, 700);
  const t = new THREE.CanvasTexture(c);
  t.encoding = THREE.sRGBEncoding;
  return t;
}

const nexieViews = [placeholderTexture(), placeholderTexture('NEXIE 2', '#9fd0f2', '#3d4f6b')];
let nexieView = 0;
const nexie = new THREE.Mesh(
  new THREE.PlaneGeometry(1, 1),
  new THREE.MeshBasicMaterial({ map: nexieViews[0], transparent: true, alphaTest: 0.35, toneMapped: false })
);
nexie.renderOrder = 20;           // after the desk
scene.add(nexie);

function placeNexie() {
  const [px, , pz] = CFG.position;
  const img = nexie.material.map.image;
  const aspect = img && img.height ? img.width / img.height : 0.5;
  const h = CFG.height, w = h * aspect;
  nexie.geometry.dispose();
  nexie.geometry = new THREE.PlaneGeometry(w, h);
  nexie.position.set(px, h / 2, pz);                  // feet on the floor
}
placeNexie();

// invisible hit box across the entrance doors
const doorHit = new THREE.Mesh(new THREE.BoxGeometry(10, 3.2, 0.4),
  new THREE.MeshBasicMaterial({ transparent: true, opacity: 0, depthWrite: false }));
doorHit.position.set(0, 1.6, hd - 0.15);
scene.add(doorHit);

// config file: lets you move her, rename her, and set the worker URL without touching this file
fetch('nexie.json').then(r => r.ok ? r.json() : null).then(cfg => {
  if (!cfg) return;
  Object.assign(CFG, cfg);
  document.getElementById('chat-name').textContent = CFG.name || 'Nexie';
  [CFG.image, CFG.image2].forEach((src, i) => {
    if (!src) return;
    new THREE.TextureLoader().load(src, t => {
      t.encoding = THREE.sRGBEncoding;
      t.anisotropy = renderer.capabilities.getMaxAnisotropy();
      nexieViews[i] = t;
      if (i === nexieView) { nexie.material.map = t; nexie.material.needsUpdate = true; placeNexie(); }
    }, undefined, () => {});
  });
  placeNexie();
}).catch(() => {});

// ---- click handling: a tap that isn't a drag ----
const raycaster = new THREE.Raycaster();
const ndc = new THREE.Vector2();
function pickAt(cx, cy) {
  ndc.set((cx / innerWidth) * 2 - 1, -(cy / innerHeight) * 2 + 1);
  raycaster.setFromCamera(ndc, camera);
  const hit = raycaster.intersectObjects([nexie, doorHit], false)[0];
  return hit ? hit.object : null;
}
const doorEl = document.getElementById('door');
function askToLeave() { modalOpen = true; doorEl.hidden = false; }
function closeDoor() { modalOpen = false; doorEl.hidden = true; }
document.getElementById('door-stay').addEventListener('click', closeDoor);
document.getElementById('door-exit').addEventListener('click', () => {
  document.getElementById('fade').classList.add('on');
  setTimeout(() => { location.href = CFG.doorUrl; }, 520);
});

// ---- chat overlay (history lives in memory only) ----
const chatEl = document.getElementById('chat');
const logEl = document.getElementById('chat-log');
const inputEl = document.getElementById('chat-input');
const sendEl = document.getElementById('chat-send');
const history = [];
function addMsg(text, cls) {
  const d = document.createElement('div');
  d.className = 'msg ' + cls;
  d.textContent = text;
  logEl.appendChild(d);
  logEl.scrollTop = logEl.scrollHeight;
  return d;
}
function openChat() {
  chatEl.hidden = false;
  if (!history.length) {
    addMsg(CFG.greeting, 'them');
    history.push({ role: 'assistant', content: CFG.greeting });
  }
  setTimeout(() => inputEl.focus(), 50);
}
function closeChat() { chatEl.hidden = true; inputEl.blur(); }
document.getElementById('chat-close').addEventListener('click', closeChat);
addEventListener('keydown', e => {
  if (e.code !== 'Escape') return;
  if (!doorEl.hidden) closeDoor(); else if (!chatEl.hidden) closeChat();
});

document.getElementById('chat-form').addEventListener('submit', async e => {
  e.preventDefault();
  const text = inputEl.value.trim();
  if (!text) return;
  inputEl.value = '';
  addMsg(text, 'me');
  history.push({ role: 'user', content: text });
  if (!CFG.endpoint) { addMsg('No chat endpoint configured yet.', 'sys'); return; }
  sendEl.disabled = true;
  const thinking = addMsg('…', 'them');
  try {
    const res = await fetch(CFG.endpoint, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ messages: history })
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    const reply = data.reply || data.choices?.[0]?.message?.content || '…';
    thinking.textContent = reply;
    history.push({ role: 'assistant', content: reply });
  } catch (err) {
    console.error('[nexie]', err);        // open devtools to see the real cause
    thinking.remove();
    addMsg("Couldn't reach Nexie just now. (" + err.message + ")", 'sys');
  } finally {
    sendEl.disabled = false;
    inputEl.focus();
  }
});

// solid interior surfaces cast and receive; glass, LEDs and the city stay out of it
// ================= FIRST-PERSON CONTROLS =================
let yaw = 0, pitch = 0;
let goalYaw = yaw, goalPitch = pitch;
const goal = new THREE.Vector3(0, EYE_HEIGHT, 7.5);
camera.position.copy(goal);

function look(dx, dy, sx, sy) {
  goalYaw += dx * LOOK_SPEED * sx;
  goalPitch = THREE.MathUtils.clamp(goalPitch + dy * LOOK_SPEED * sy, -1.3, 1.3);
}
function walk(forward, right) {
  const s = Math.sin(goalYaw), c = Math.cos(goalYaw);
  goal.x += -s * forward + c * right;
  goal.z += -c * forward - s * right;
  constrain();
}
function constrain() {
  const r = PLAYER_RADIUS;
  goal.x = THREE.MathUtils.clamp(goal.x, -hw + r, hw - r);
  goal.z = THREE.MathUtils.clamp(goal.z, -hd + r + 0.3, hd - r);
  for (const b of obstacles) {
    const x0 = b.min.x - r, x1 = b.max.x + r, z0 = b.min.z - r, z1 = b.max.z + r;
    if (goal.x > x0 && goal.x < x1 && goal.z > z0 && goal.z < z1) {
      const pl = goal.x - x0, pr = x1 - goal.x, pb = goal.z - z0, pf = z1 - goal.z;
      const m = Math.min(pl, pr, pb, pf);
      if (m === pl) goal.x = x0; else if (m === pr) goal.x = x1;
      else if (m === pb) goal.z = z0; else goal.z = z1;
    }
  }
}

const el = renderer.domElement;
const pointers = new Map();
let pinchDist = 0, midX = 0, midY = 0;

function twoFingerState() {
  const [a, b] = [...pointers.values()];
  return { dist: Math.hypot(a.x - b.x, a.y - b.y), mx: (a.x + b.x) / 2, my: (a.y + b.y) / 2 };
}

el.addEventListener('pointerdown', e => {
  if (modalOpen) return;
  tap = { x: e.clientX, y: e.clientY, t: performance.now() };
  el.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY, button: e.button, type: e.pointerType });
  if (pointers.size === 2) ({ dist: pinchDist, mx: midX, my: midY } = twoFingerState());
  if (pointers.size === 3) toggleStats();                       // three-finger tap on mobile
});

let tap = null;
el.addEventListener('pointermove', e => {
  const p = pointers.get(e.pointerId);
  if (!p) return;
  const dx = e.clientX - p.x, dy = e.clientY - p.y;
  p.x = e.clientX; p.y = e.clientY;

  if (pointers.size === 1) {
    if (p.type === 'mouse') {
      if (p.button === 2) walk(dy * 0.02, -dx * 0.02);
      else look(dx, dy, DESKTOP_LOOK_X, DESKTOP_LOOK_Y);
    } else {
      look(dx, dy, TOUCH_LOOK_X, TOUCH_LOOK_Y);
    }
  } else if (pointers.size === 2) {
    const s = twoFingerState();
    const k = 0.025;
    walk((s.my - midY) * k + (s.dist - pinchDist) * 0.03, -(s.mx - midX) * k);
    pinchDist = s.dist; midX = s.mx; midY = s.my;
  }
});

function endPointer(e) {
  if (tap && pointers.size === 1) {                 // a tap, not a drag: pick what's under it
    const moved = Math.hypot(e.clientX - tap.x, e.clientY - tap.y);
    if (moved < 9 && performance.now() - tap.t < 350) {
      const obj = pickAt(e.clientX, e.clientY);
      if (obj === nexie) openChat();
      else if (obj === doorHit) askToLeave();
    }
  }
  tap = null;
  pointers.delete(e.pointerId);
  if (pointers.size === 2) ({ dist: pinchDist, mx: midX, my: midY } = twoFingerState());
}
el.addEventListener('pointerup', endPointer);
el.addEventListener('pointercancel', endPointer);
el.addEventListener('contextmenu', e => e.preventDefault());

el.addEventListener('wheel', e => {
  if (modalOpen) return;
  e.preventDefault();
  const d = THREE.MathUtils.clamp(e.deltaY, -100, 100);
  walk(-d * 0.012, 0);
}, { passive: false });

const keys = new Set();
addEventListener('keydown', e => { if (!modalOpen && !typing()) keys.add(e.code); });
addEventListener('keyup', e => keys.delete(e.code));

// ================= LOOP =================
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

el.addEventListener('pointermove', e => {
  if (e.pointerType !== 'mouse' || pointers.size) return;
  el.style.cursor = pickAt(e.clientX, e.clientY) ? 'pointer' : 'grab';
});

// press P for a frame counter and draw-call readout
const statsEl = document.getElementById('stats');
let statsOn = false, frames = 0, statsFrom = performance.now(), fps = 0;
function toggleStats() { statsOn = !statsOn; statsEl.hidden = !statsOn; }
addEventListener('keydown', e => { if (e.code === 'KeyP' && !modalOpen && !typing()) toggleStats(); });
if (location.search.includes('stats')) toggleStats();          // ?stats=1 on any device

document.addEventListener('visibilitychange', () => {
  renderer.setAnimationLoop(document.hidden ? null : frame);   // no work in a background tab
});

const bootAt = performance.now();
let booted = false;

const clock = new THREE.Clock();
const FPS_CAP = isTouch ? 60 : 30;       // frames per second: phones 60, desktop 30
const IDLE_FPS = 12;                     // after IDLE_AFTER seconds with no input
const IDLE_AFTER = 20;
const AWAY_FPS = 5;                      // window not focused
let lastInput = performance.now();
['pointerdown', 'pointermove', 'wheel', 'keydown', 'touchstart'].forEach(ev =>
  addEventListener(ev, () => { lastInput = performance.now(); }, { passive: true }));
let nextFrameAt = 0, mode = 'active', workMs = 0;

function frame(now = performance.now()) {
  mode = !document.hasFocus() ? 'away' : (now - lastInput > IDLE_AFTER * 1000 ? 'idle' : 'active');
  const cap = mode === 'away' ? AWAY_FPS : mode === 'idle' ? IDLE_FPS : FPS_CAP;
  const FRAME_MS = 1000 / cap;
  if (now < nextFrameAt - 1) return;      // not this refresh
  // step the schedule forward by exactly one frame; if we fell far behind, resync
  nextFrameAt = now - nextFrameAt > FRAME_MS ? now + FRAME_MS : nextFrameAt + FRAME_MS;
  const workStart = performance.now();
  const dt = Math.min(clock.getDelta(), 0.05);
  if (!booted) {                                   // hold the title card for a beat
    booted = true;
    const el = document.getElementById('loading');
    setTimeout(() => el.classList.add('off'), Math.max(0, 1000 - (performance.now() - bootAt)));
    setTimeout(() => el.remove(), 1800);
  }
  // rain.update(performance.now());   // uncomment to let the background rain flow again
  glyphRain.update(dt);

  const speed = (keys.has('ShiftLeft') ? 9 : 4.5) * dt;
  let f = 0, r = 0;
  if (keys.has('KeyW') || keys.has('ArrowUp')) f += speed;
  if (keys.has('KeyS') || keys.has('ArrowDown')) f -= speed;
  if (keys.has('KeyD')) r += speed;
  if (keys.has('KeyA')) r -= speed;
  if (keys.has('ArrowLeft')) goalYaw += 1.8 * dt;
  if (keys.has('ArrowRight')) goalYaw -= 1.8 * dt;
  if (f || r) walk(f, r);

  const a = 1 - Math.pow(0.0005, dt);
  yaw += (goalYaw - yaw) * a;
  pitch += (goalPitch - pitch) * a;
  camera.position.lerp(goal, a);
  camera.rotation.set(pitch, yaw, 0);
  const nAng = Math.atan2(camera.position.x - nexie.position.x, camera.position.z - nexie.position.z);
  nexie.rotation.y = nAng;
  // angle 0 = straight in front of her, negative = her right (your left), ±PI = behind her.
  // View 2 covers her 2 o'clock (-60 deg) round to directly behind; small dead zones stop flicker.
  const wantView = nexieView === 0
    ? ((nAng < -1.05 && nAng > -Math.PI + 0.07) ? 1 : 0)
    : ((nAng > -0.9 && nAng < Math.PI - 0.07) ? 0 : 1);
  if (wantView !== nexieView) {
    nexieView = wantView;
    nexie.material.map = nexieViews[nexieView];
    nexie.material.needsUpdate = true;
    placeNexie();
  }

  renderer.render(scene, camera);
  workMs = workMs * 0.9 + (performance.now() - workStart) * 0.1;   // smoothed

  if (statsOn) {
    frames++;
    const span = now - statsFrom;
    if (span >= 1000) { fps = Math.round(frames * 1000 / span); frames = 0; statsFrom = now; }
    const r = renderer.info.render, mem = renderer.info.memory;
    const budget = 1000 / (mode === 'away' ? AWAY_FPS : mode === 'idle' ? IDLE_FPS : FPS_CAP);
    statsEl.textContent =
      `${fps} fps  (${mode}, cap ${Math.round(1000 / budget)})\n` +
      `work   ${workMs.toFixed(1)} ms / ${budget.toFixed(0)} ms  ${Math.round(workMs / budget * 100)}%\n` +
      `calls  ${r.calls}\n` +
      `tris   ${(r.triangles / 1000).toFixed(0)}k\n` +
      `geo ${mem.geometries}  tex ${mem.textures}  prog ${renderer.info.programs.length}\n` +
      `dpr    ${renderer.getPixelRatio().toFixed(2)}`;
  }
}
renderer.setAnimationLoop(frame);
</script>
</body>
